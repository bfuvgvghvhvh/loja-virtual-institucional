<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Loja de Maquilhagem</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Loja de Maquilhagem</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="contato.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Fale Connosco</h2>
            <p>Dúvidas sobre produtos, encomendas ou sugestões? Envie-nos uma mensagem!</p>
            
            <form action="#" method="POST">
                <p>
                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" placeholder="O seu nome" required>
                </p>
                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </p>
                <p>
                    <label for="assunto">Assunto:</label><br>
                    <select id="assunto" name="assunto" required>
                        <option value="">Selecione um assunto</option>
                        <option value="duvidas">Dúvidas sobre Produtos</option>
                        <option value="pedidos">Status da Encomenda</option>
                        <option value="outros">Outros Assuntos</option>
                    </select>
                </p>
                <p>
                    <label for="mensagem">Mensagem:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui a sua mensagem..." required></textarea>
                </p>
                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Loja de Maquilhagem - NovaWeb Studio</p>
    </footer>
</body>
</html>
